<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Biblioteca</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        header {
            background-color: #7a1f16;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        nav {
            background-color: #53130e;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(200px, 1fr)
            );
            gap: 20px;
        }

        .numero {
            font-size: 35px;
            font-weight: bold;
            color: #7a1f16;
        }

        .botao {
            display: inline-block;
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            background-color: #7a1f16;
            color: white;
            text-decoration: none;
            cursor: pointer;
            margin: 3px;
        }

        .botao:hover {
            background-color: #53130e;
        }

        .botao-editar {
            background-color: #1976d2;
        }

        .botao-excluir {
            background-color: #c62828;
        }

        .campo {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .pesquisa {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .pesquisa input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #7a1f16;
            color: white;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        .disponivel {
            color: green;
            font-weight: bold;
        }

        .indisponivel {
            color: red;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
        }

    </style>

</head>


<body>


<header>

    <h1>
        📚 Sistema de Biblioteca
    </h1>

    <p>
        Gerenciamento de livros
    </p>

</header>


<nav>

    <a href="{% url 'inicio' %}">
        Início
    </a>

    <a href="{% url 'lista' %}">
        Livros
    </a>

    <a href="{% url 'novo_livro' %}">
        Cadastrar Livro
    </a>

    <a href="/admin/">
        Admin
    </a>

</nav>


<main class="container">

    {% block conteudo %}

    {% endblock %}

</main>


<footer>

    Sistema de Biblioteca - Django

</footer>


</body>

</html>
